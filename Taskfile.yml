version: "3"

vars:
  APP: domjudge-helper
  LDFLAGS: -ldflags="-s -w"

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build binary for current platform
    cmds:
      - go build {{.LDFLAGS}} -o bin/{{.APP}}{{exeExt}} .

  build-windows:
    desc: Build for Windows amd64
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - mkdir -p bin
      - go build {{.LDFLAGS}} -o bin/{{.APP}}-windows-amd64.exe .

  build-linux:
    desc: Build for Linux amd64
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - mkdir -p bin
      - go build {{.LDFLAGS}} -o bin/{{.APP}}-linux-amd64 .

  build-mac-arm:
    desc: Build for macOS arm64 (Apple Silicon)
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - mkdir -p bin
      - go build {{.LDFLAGS}} -o bin/{{.APP}}-macos-arm64 .

  build-mac-amd:
    desc: Build for macOS amd64 (Intel)
    env:
      GOOS: darwin
      GOARCH: amd64
    cmds:
      - mkdir -p bin
      - go build {{.LDFLAGS}} -o bin/{{.APP}}-macos-amd64 .

  build-all-platforms:
    desc: Build binaries for all platforms
    cmds:
      - task: build-windows
      - task: build-linux
      - task: build-mac-arm
      - task: build-mac-amd

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ {{.APP}} {{.APP}}.exe
